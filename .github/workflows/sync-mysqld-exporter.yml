name: 定时同步 prom/mysqld-exporter 镜像（增量同步·免提交版）
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: liutools/mysqld-exporter
      SOURCE_IMAGE: prom/mysqld-exporter
      ALI_REGISTRY: ${{ secrets.ALI_REGISTRY }}

    steps:
      - name: 登录阿里云ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALI_REGISTRY }}
          username: ${{ secrets.ALI_USER }}
          password: ${{ secrets.ALI_PASSWORD }}

      - name: 安装依赖 jq
        run: sudo apt update && sudo apt install -y jq

      - name: 增量同步镜像（直接对比目标仓库标签，免文件提交）
        run: |
          set +e
          # 获取源仓库所有标签
          SOURCE_TAGS=$(curl -s "https://hub.docker.com/v2/repositories/${SOURCE_IMAGE}/tags?page_size=100" | jq -r '.results[].name')
          # 获取目标阿里云仓库已存在标签
          TARGET_TAGS=$(curl -s "https://${ALI_REGISTRY}/v2/${TARGET_REPO}/tags/list" -u "${{ secrets.ALI_USER }}:${{ secrets.ALI_PASSWORD }}" | jq -r '.tags[]')
          
          for TAG in $SOURCE_TAGS; do
            if ! echo "$TARGET_TAGS" | grep -qx "$TAG"; then
              echo "🚀 同步新标签：$TAG"
              DOCKER_ENGINE_OPTIONS="--log-level=error" docker pull ${SOURCE_IMAGE}:$TAG
              docker tag ${SOURCE_IMAGE}:$TAG ${ALI_REGISTRY}/${TARGET_REPO}:$TAG
              DOCKER_ENGINE_OPTIONS="--log-level=error" docker push ${ALI_REGISTRY}/${TARGET_REPO}:$TAG
              if [ $? -eq 0 ]; then
                echo "✅ $TAG 同步成功"
              else
                echo "⚠️ $TAG 同步失败，跳过"
              fi
            else
              echo "✅ 标签已存在，跳过：$TAG"
            fi
          done
