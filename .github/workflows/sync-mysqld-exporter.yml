name: 定时同步 prom/mysqld-exporter 镜像（增量同步）
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-image:
    runs-on: ubuntu-latest
    env:
      TARGET_REGISTRY: crpi-eiv90cjbtmuyblxf.cn-hangzhou.personal.cr.aliyuncs.com
      TARGET_REPO: liutools/mysqld-exporter
      SOURCE_IMAGE: prom/mysqld-exporter
      SYNCED_TAGS_FILE: synced_tags.txt

    steps:
      - name: 检出仓库（用于保存已同步标签）
        uses: actions/checkout@v4

      - name: 登录阿里云镜像仓库（稳定版）
        run: |
          docker login ${TARGET_REGISTRY} -u ${{ secrets.DOCKER_USERNAME }} --password-stdin <<< ${{ secrets.DOCKER_PASSWORD }}

      - name: 安装依赖 jq
        run: sudo apt update && sudo apt install -y jq

      - name: 增量同步镜像（只同步新增tag）
        run: |
          touch ${SYNCED_TAGS_FILE}
          # 获取源仓库所有标签
          TAGS=$(curl -s "https://hub.docker.com/v2/repositories/${SOURCE_IMAGE}/tags?page_size=100" | jq -r '.results[].name')
          # 循环增量同步
          for TAG in $TAGS; do
            if ! grep -qx "$TAG" ${SYNCED_TAGS_FILE}; then
              echo "🚀 同步新标签：$TAG"
              docker pull ${SOURCE_IMAGE}:$TAG
              docker tag ${SOURCE_IMAGE}:$TAG ${TARGET_REGISTRY}/${TARGET_REPO}:$TAG
              docker push ${TARGET_REGISTRY}/${TARGET_REPO}:$TAG
              echo "$TAG" >> ${SYNCED_TAGS_FILE}
            else
              echo "✅ 标签已存在，跳过：$TAG"
            fi
          done

      - name: 提交已同步标签记录
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update synced tags [skip ci]"
          add: ${{ env.SYNCED_TAGS_FILE }}
          committer_name: GitHub Actions
          committer_email: actions@github.com
