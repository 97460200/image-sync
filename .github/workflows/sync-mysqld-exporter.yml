name: 定时同步 prom/mysqld-exporter 镜像

# 触发规则：每天凌晨2点执行，可自定义 cron
on:
  schedule:
    - cron: '0 2 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  sync-image:
    runs-on: ubuntu-latest
    steps:
      - name: 安装依赖 & 登录 Docker
        env:
          # ========== 配置你的镜像仓库信息 ==========
          # 目标镜像仓库地址，例如阿里云：registry.cn-beijing.aliyuncs.com
          TARGET_REGISTRY: crpi-eiv90cjbtmuyblxf.cn-hangzhou.personal.cr.aliyuncs.com
          # 目标镜像仓库命名空间/仓库名
          TARGET_REPO: liutools/mysqld-exporter
          # 原镜像名称
          SOURCE_IMAGE: prom/mysqld-exporter
          # 仓库密钥，在GitHub仓库 Secrets 中配置
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          # 登录目标镜像仓库
          docker login $TARGET_REGISTRY -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
          
          # 安装 jq 解析Tag
          sudo apt update && sudo apt install -y jq
          
          # 获取原镜像所有Tag
          TAGS=$(curl -s "https://hub.docker.com/v2/repositories/${SOURCE_IMAGE}/tags?page_size=100" | jq -r '.results[].name')
          
          # 循环同步每个Tag
          for TAG in $TAGS; do
            echo "开始同步标签: $TAG"
            docker pull $SOURCE_IMAGE:$TAG
            docker tag $SOURCE_IMAGE:$TAG $TARGET_REGISTRY/$TARGET_REPO:$TAG
            docker push $TARGET_REGISTRY/$TARGET_REPO:$TAG
            echo "标签 $TAG 同步完成"
          done
