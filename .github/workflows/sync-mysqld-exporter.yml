name: 定时同步 prom/mysqld-exporter 镜像（增量同步）
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: liutools/mysqld-exporter
      SOURCE_IMAGE: prom/mysqld-exporter
      SYNCED_TAGS_FILE: synced_tags.txt
      ALI_REGISTRY: ${{ secrets.ALI_REGISTRY }}
      # 关闭Docker弃用格式告警
      DOCKER_CONFIG: /dev/null

    steps:
      - name: 检出仓库（用于保存已同步标签）
        uses: actions/checkout@v4

      - name: 登录阿里云ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALI_REGISTRY }}
          username: ${{ secrets.ALI_USER }}
          password: ${{ secrets.ALI_PASSWORD }}

      - name: 安装依赖 jq
        run: sudo apt update && sudo apt install -y jq

      - name: 增量同步镜像（只同步新增tag，容错版）
        run: |
          set +e  # 开启容错，单个tag失败不退出
          touch ${SYNCED_TAGS_FILE}
          TAGS=$(curl -s "https://hub.docker.com/v2/repositories/${SOURCE_IMAGE}/tags?page_size=100" | jq -r '.results[].name')
          for TAG in $TAGS; do
            if ! grep -qx "$TAG" ${SYNCED_TAGS_FILE}; then
              echo "🚀 同步新标签：$TAG"
              docker pull ${SOURCE_IMAGE}:$TAG
              docker tag ${SOURCE_IMAGE}:$TAG ${ALI_REGISTRY}/${TARGET_REPO}:$TAG
              docker push ${ALI_REGISTRY}/${TARGET_REPO}:$TAG
              if [ $? -eq 0 ]; then
                echo "$TAG" >> ${SYNCED_TAGS_FILE}
                echo "✅ $TAG 同步成功"
              else
                echo "⚠️ $TAG 同步失败，跳过"
              fi
            else
              echo "✅ 标签已存在，跳过：$TAG"
            fi
          done

      - name: 提交已同步标签记录
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update synced tags [skip ci]"
          add: ${{ env.SYNCED_TAGS_FILE }}
          committer_name: GitHub Actions
          committer_email: actions@github.com
